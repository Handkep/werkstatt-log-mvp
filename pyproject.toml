[tool.pytest.ini_options]
testpaths = ["tests"]
# All tests use synchronous TestClient/Playwright; the unused AnyIO plugin still
# imports a deprecated pytest alias and fails under our warning-as-error CI.
addopts = "-ra -p no:anyio"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]
