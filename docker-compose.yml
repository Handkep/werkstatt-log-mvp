services:
  werkstatt-log:
    build: .
    container_name: werkstatt-log
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "9000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      - PUBLIC_BASE_URL=http://192.168.2.127:8000