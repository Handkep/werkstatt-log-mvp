services:
  werkstatt-log:
    build: .
    container_name: werkstatt-log
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${HOST_PORT:-9000}:8000"
    volumes:
      - ./app:/app/app
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://192.168.2.127:9000}
      - MAX_UPLOAD_IMAGES=${MAX_UPLOAD_IMAGES:-10}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - MAX_NAME_LENGTH=${MAX_NAME_LENGTH:-100}
      - MAX_HOUSE_LENGTH=${MAX_HOUSE_LENGTH:-10}
      - MAX_COMMENT_LENGTH=${MAX_COMMENT_LENGTH:-2000}
      - MAX_GENERAL_NOTE_LENGTH=${MAX_GENERAL_NOTE_LENGTH:-4000}
