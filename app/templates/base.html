<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Werkstatt Log{% endblock %}</title>
  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.documentElement.dataset.theme = savedTheme;
    }
  </script>
  <link rel="stylesheet" href="/static/style.css?v=27">
  <script src="/static/theme.js?v=8" defer></script>
</head>
<body>
  <main class="page">
    {% include "_nav.html" %}
    {% block content %}{% endblock %}
    <footer class="site-footer">
      &copy; 2026 Paulus Handke. All rights reserved.
    </footer>
  </main>
</body>
</html>
