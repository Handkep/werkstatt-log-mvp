<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Zelter5 Raumlog{% endblock %}</title>
  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.documentElement.dataset.theme = savedTheme;
    }
  </script>
  <link rel="stylesheet" href="/static/style.css?v=38">
  <script src="/static/theme.js?v=11" defer></script>
</head>
<body>
  <main class="page{% if room_mode %} is-room-mode{% endif %}">
    {% if room_mode %}
      <header class="room-mode-header">
        <a class="room-mode-overview-link" href="/">Zur Übersicht</a>
        {% include "theme_toggle.html" %}
      </header>
    {% else %}
      {% include "_nav.html" %}
    {% endif %}
    {% block content %}{% endblock %}
    {% if not room_mode %}
      <footer class="site-footer">
        &copy; 2026 Paulus Handke. All rights reserved.
      </footer>
    {% endif %}
  </main>
</body>
</html>
