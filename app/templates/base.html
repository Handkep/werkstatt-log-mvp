<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Zelter5 Raumlog{% endblock %}</title>
  <link rel="preload" href="/static/fonts/google-sans-flex-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script nonce="{{ csp_nonce }}">
    try {
      const savedTheme = localStorage.getItem("theme");
      if (["light", "dark"].includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
    } catch { /* Browser-Speicher ist optional. */ }
  </script>
  {% if room_access_exchange_path %}
    <script src="/static/room-access.js?v={{ asset_version }}" data-room-access-exchange="{{ room_access_exchange_path }}"></script>
  {% endif %}
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <script src="/static/theme.js?v={{ asset_version }}" defer></script>
</head>
<body>
  <main class="page">
    {% include "_nav.html" %}
    {% block content %}{% endblock %}
    <footer class="site-footer">
      {% block footer_content %}{% endblock %}
      &copy; 2026 Paulus Handke. All rights reserved.
    </footer>
  </main>
</body>
</html>
