{% from "_icons.html" import icon %}
<header class="site-header">
  <div class="site-header-top">
    <a class="site-brand" href="/">
      <span class="site-brand-kicker">Zelter5</span>
      <strong>{{ site_title }}</strong>
    </a>
    <div class="site-header-actions">
      {% include "theme_toggle.html" %}
      <details class="admin-menu{% if admin_section_active %} is-current{% endif %}" data-admin-menu>
        <summary class="icon-button admin-menu-toggle" aria-label="Verwaltung" data-tooltip="Verwaltung">
          {{ icon('shield-user') }}
        </summary>
        <nav class="admin-menu-panel" aria-label="Verwaltung">
          {% for item in admin_items %}
            <a href="{{ item.href }}"{% if item.is_current %} aria-current="page"{% endif %}>{{ item.label }}</a>
          {% endfor %}
        </nav>
      </details>
    </div>
  </div>

  <nav class="site-nav" aria-label="Hauptnavigation">
    {% for item in nav_items %}
      <a
        class="site-nav-link{% if item.is_current %} is-current{% endif %}"
        href="{{ item.href }}"
        {% if item.is_current %}aria-current="page"{% endif %}
      >
        {{ item.label }}
      </a>
    {% endfor %}
  </nav>
</header>
