{% extends "base.html" %}
{% block title %}Räume{% endblock %}

{% block content %}
<section class="card">
  <h1>Räume</h1>

  <div class="room-grid">
    {% for room in rooms %}
      <article class="room-card room-card-clickable clickable-row" data-href="/r/{{ room.slug }}" tabindex="0">
        {% if has_read_access %}
        <div class="room-card-top">
          <a class="room-card-qr" href="{% if admin_authenticated %}/admin/rooms/{{ room.id }}/qr.pdf{% else %}/r/{{ room.slug }}/qr.pdf{% endif %}" download
             aria-label="QR-Code für {{ room.name }} herunterladen" title="QR-Code als PDF herunterladen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="6" height="6" rx="0.8" />
              <rect x="15" y="3" width="6" height="6" rx="0.8" />
              <rect x="3" y="15" width="6" height="6" rx="0.8" />
              <path d="M15 15h3v3h3v3h-6v-3M21 15h.01M12 3v3M12 12h3M3 12h3M9 12h.01M12 18v3" />
            </svg>
          </a>
        </div>
        {% endif %}
        <div class="room-card-copy">
          <h2>{{ room.name }}</h2>
          <p>{{ room.description }}</p>
        </div>
      </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
